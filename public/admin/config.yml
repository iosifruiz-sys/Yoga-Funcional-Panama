locale: es

backend:
  name: turbo-github
  turbo_site_id: e3593ca7-f227-42f0-8069-2b27acfb1add
  branch: main

media_folder: public/images
# Astro's image() schema expects source-relative paths to files in public/images.
public_folder: ../../../public/images

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: homepage
    label: Página principal
    format: json
    editor:
      preview: false
    files:
      - name: hero_es
        label: Hero ES
        file: src/data/hero/es.json
        fields:
          - { label: Franja superior, name: kicker, widget: string }
          - label: Título (tres líneas)
            name: title
            widget: object
            fields:
              - { label: Línea 1, name: yoga, widget: string }
              - { label: Línea 2, name: funcional, widget: string }
              - { label: Línea 3, name: panama, widget: string }
          - { label: Texto alternativo de la imagen, name: alt, widget: string }
          - { label: Frase inicial, name: quote, widget: string }
          - { label: Frase destacada, name: strong, widget: string }
          - { label: Botón de reserva, name: reserve, widget: string, hint: "Solo el botón del Hero; no cambia otros botones." }
          - { label: Ubicación, name: location, widget: string }
          - { label: Coordenadas, name: coordinates, widget: string }
          - { label: Aviso de clases, name: soon, widget: string }
      - name: hero_ru
        label: Hero RU
        file: src/data/hero/ru.json
        fields:
          - { label: Верхняя строка, name: kicker, widget: string }
          - label: Заголовок (три строки)
            name: title
            widget: object
            fields:
              - { label: Строка 1, name: yoga, widget: string }
              - { label: Строка 2, name: funcional, widget: string }
              - { label: Строка 3, name: panama, widget: string }
          - { label: Альтернативный текст изображения, name: alt, widget: string }
          - { label: Первая фраза, name: quote, widget: string }
          - { label: Выделенная фраза, name: strong, widget: string }
          - { label: Кнопка записи, name: reserve, widget: string, hint: "Только кнопка Hero; остальные кнопки не меняются." }
          - { label: Место, name: location, widget: string }
          - { label: Координаты, name: coordinates, widget: string }
          - { label: Подпись о занятиях, name: soon, widget: string }

      - name: method_es
        label: Método ES
        file: src/data/method/es.json
        fields:
          - { label: Número y nombre de sección, name: number, widget: string }
          - label: Título (tres líneas)
            name: title
            widget: object
            fields:
              - { label: Línea 1, name: first, widget: string }
              - { label: Línea 2, name: middle, widget: string }
              - { label: Línea 3, name: last, widget: string }
          - { label: Texto introductorio, name: copy, widget: string }
          - { label: Afirmación adicional, name: copy2, widget: string }
          - { label: Afirmación destacada, name: copy3, widget: string }
          - { label: Etiqueta accesible de las capacidades, name: label, widget: string }
          - label: Siete capacidades (orden fijo)
            name: qualities
            widget: object
            fields:
              - label: 01 / Fuerza
                name: strength
                widget: object
                fields:
                  - { label: Nombre, name: name, widget: string }
                  - { label: Descripción, name: description, widget: string }
              - label: 02 / Movilidad
                name: mobility
                widget: object
                fields:
                  - { label: Nombre, name: name, widget: string }
                  - { label: Descripción, name: description, widget: string }
              - label: 03 / Equilibrio
                name: balance
                widget: object
                fields:
                  - { label: Nombre, name: name, widget: string }
                  - { label: Descripción, name: description, widget: string }
              - label: 04 / Coordinación
                name: coordination
                widget: object
                fields:
                  - { label: Nombre, name: name, widget: string }
                  - { label: Descripción, name: description, widget: string }
              - label: 05 / Respiración
                name: breathing
                widget: object
                fields:
                  - { label: Nombre, name: name, widget: string }
                  - { label: Descripción, name: description, widget: string }
              - label: 06 / Atención
                name: attention
                widget: object
                fields:
                  - { label: Nombre, name: name, widget: string }
                  - { label: Descripción, name: description, widget: string }
              - label: 07 / Recuperación
                name: recovery
                widget: object
                fields:
                  - { label: Nombre, name: name, widget: string }
                  - { label: Descripción, name: description, widget: string }
          - { label: Frase final, name: end, widget: string }
      - name: method_ru
        label: Метод RU
        file: src/data/method/ru.json
        fields:
          - { label: Номер и название раздела, name: number, widget: string }
          - label: Заголовок (три строки)
            name: title
            widget: object
            fields:
              - { label: Строка 1, name: first, widget: string }
              - { label: Строка 2, name: middle, widget: string }
              - { label: Строка 3, name: last, widget: string }
          - { label: Вводный текст, name: copy, widget: string }
          - { label: Дополнительное утверждение, name: copy2, widget: string }
          - { label: Выделенное утверждение, name: copy3, widget: string }
          - { label: Подпись списка качеств для скринридеров, name: label, widget: string }
          - label: Семь качеств (фиксированный порядок)
            name: qualities
            widget: object
            fields:
              - label: 01 / Сила
                name: strength
                widget: object
                fields:
                  - { label: Название, name: name, widget: string }
                  - { label: Описание, name: description, widget: string }
              - label: 02 / Мобильность
                name: mobility
                widget: object
                fields:
                  - { label: Название, name: name, widget: string }
                  - { label: Описание, name: description, widget: string }
              - label: 03 / Равновесие
                name: balance
                widget: object
                fields:
                  - { label: Название, name: name, widget: string }
                  - { label: Описание, name: description, widget: string }
              - label: 04 / Координация
                name: coordination
                widget: object
                fields:
                  - { label: Название, name: name, widget: string }
                  - { label: Описание, name: description, widget: string }
              - label: 05 / Дыхание
                name: breathing
                widget: object
                fields:
                  - { label: Название, name: name, widget: string }
                  - { label: Описание, name: description, widget: string }
              - label: 06 / Внимание
                name: attention
                widget: object
                fields:
                  - { label: Название, name: name, widget: string }
                  - { label: Описание, name: description, widget: string }
              - label: 07 / Восстановление
                name: recovery
                widget: object
                fields:
                  - { label: Название, name: name, widget: string }
                  - { label: Описание, name: description, widget: string }
          - { label: Заключительная фраза, name: end, widget: string }

      - name: classes_es
        label: Clases ES
        file: src/data/classes/es.json
        fields:
          - { label: Número y nombre de sección, name: number, widget: string }
          - label: Título (dos líneas)
            name: title
            widget: object
            fields:
              - { label: Línea 1, name: first, widget: string }
              - { label: Línea 2, name: second, widget: string }
          - label: Tres formatos (orden fijo)
            name: formats
            widget: object
            fields:
              - label: 01 / Clase general
                name: group
                widget: object
                fields:
                  - { label: Nombre, name: name, widget: string }
                  - { label: Primer párrafo, name: description, widget: string }
                  - { label: Segundo párrafo, name: details, widget: string }
                  - { label: Texto del botón, name: action, widget: string }
              - label: 02 / Clase individual
                name: individual
                widget: object
                fields:
                  - { label: Nombre, name: name, widget: string }
                  - { label: Precio, name: price, widget: string }
                  - { label: Primer párrafo, name: description, widget: string }
                  - { label: Segundo párrafo, name: details, widget: string }
                  - { label: Texto del botón, name: action, widget: string }
              - label: 03 / Entrenamiento personal
                name: personal
                widget: object
                fields:
                  - { label: Nombre, name: name, widget: string }
                  - { label: Precio, name: price, widget: string }
                  - { label: Primer párrafo, name: description, widget: string }
                  - { label: Segundo párrafo, name: details, widget: string }
                  - { label: Texto del botón, name: action, widget: string }
      - name: classes_ru
        label: Занятия RU
        file: src/data/classes/ru.json
        fields:
          - { label: Номер и название раздела, name: number, widget: string }
          - label: Заголовок (две строки)
            name: title
            widget: object
            fields:
              - { label: Строка 1, name: first, widget: string }
              - { label: Строка 2, name: second, widget: string }
          - label: Три формата (фиксированный порядок)
            name: formats
            widget: object
            fields:
              - label: 01 / Общее занятие
                name: group
                widget: object
                fields:
                  - { label: Название, name: name, widget: string }
                  - { label: Первый абзац, name: description, widget: string }
                  - { label: Второй абзац, name: details, widget: string }
                  - { label: Подпись кнопки, name: action, widget: string }
              - label: 02 / Индивидуальное занятие
                name: individual
                widget: object
                fields:
                  - { label: Название, name: name, widget: string }
                  - { label: Цена, name: price, widget: string }
                  - { label: Первый абзац, name: description, widget: string }
                  - { label: Второй абзац, name: details, widget: string }
                  - { label: Подпись кнопки, name: action, widget: string }
              - label: 03 / Персональная тренировка
                name: personal
                widget: object
                fields:
                  - { label: Название, name: name, widget: string }
                  - { label: Цена, name: price, widget: string }
                  - { label: Первый абзац, name: description, widget: string }
                  - { label: Второй абзац, name: details, widget: string }
                  - { label: Подпись кнопки, name: action, widget: string }
      - name: classes_links
        label: Enlace de reserva / Общая ссылка записи
        file: src/data/classes/links.json
        fields:
          - label: WhatsApp ES + RU
            name: personalBookingUrl
            widget: string
            hint: "CLASES / ЗАНЯТИЯ — ссылка индивидуальных и персональных занятий для обоих языков. Solo las clases individuales y personales; no cambia otros apartados."

      - name: schedule_classes
        label: Horarios — Clases grupales
        file: src/data/schedule/classes.json
        fields:
          - label: Enlace del botón general de reserva
            name: bookingUrl
            widget: string
            pattern: ['^https://[^\s]+$', 'Usa una URL HTTPS completa, incluido https://wa.me/.']
            hint: "Botón general de HORARIOS en ES y RU. Es independiente de los enlaces de cada clase y no cambia HERO ni CLASES."
          - label: Clases grupales
            name: classes
            widget: list
            required: false
            default: []
            summary: "{{fields.day}} / {{fields.startTime}} / {{fields.studio}}"
            hint: "Solo clases grupales. Se ordenan de lunes a domingo y por hora; admite varias clases al día. El listado actual muestra solo día y hora. Los demás datos se guardan para un futuro calendario. La cuadrícula de escritorio mantiene tres columnas y crea filas adicionales."
            fields:
              - label: Día
                name: day
                widget: select
                options:
                  - { label: Lunes, value: monday }
                  - { label: Martes, value: tuesday }
                  - { label: Miércoles, value: wednesday }
                  - { label: Jueves, value: thursday }
                  - { label: Viernes, value: friday }
                  - { label: Sábado, value: saturday }
                  - { label: Domingo, value: sunday }
              - label: Hora de inicio (HH:mm)
                name: startTime
                widget: string
                pattern: ['^(?:[01][0-9]|2[0-3]):[0-5][0-9]$', 'Usa HH:mm, de 00:00 a 23:59 (por ejemplo 18:15).']
                hint: "Hora local, sin conversión de zona horaria. El sitio conserva el formato AM/PM."
              - { label: Estudio / lugar, name: studio, widget: string, hint: "El sitio actual solo indica Clayton; sustituye esta referencia por el nombre real cuando lo conozcas. No se muestra por clase en este listado." }
              - label: Tipo de clase
                name: classType
                widget: select
                default: group
                options:
                  - { label: Clase grupal, value: group }
              - label: Enlace de reserva de esta clase
                name: bookingUrl
                widget: string
                pattern: ['^https://[^\s]+$', 'Usa una URL HTTPS de WhatsApp o del estudio.']
                hint: "Se guarda para esta clase. No sustituye el botón general ni se muestra como enlace adicional."
      - name: schedule_es
        label: Horarios ES
        file: src/data/schedule/es.json
        fields:
          - { label: Número y nombre de sección, name: number, widget: string }
          - label: Título móvil (dos líneas)
            name: title
            widget: object
            fields:
              - { label: Línea 1, name: first, widget: string }
              - { label: Línea 2, name: second, widget: string }
          - label: Título de escritorio ES (dos líneas)
            name: desktopTitle
            widget: object
            fields:
              - { label: Línea 1, name: first, widget: string }
              - { label: Línea 2, name: second, widget: string }
          - { label: Etiqueta accesible de información, name: info, widget: string }
          - { label: Tipo mostrado en la franja, name: kind, widget: string }
          - { label: Etiqueta accesible del listado, name: label, widget: string }
          - { label: Nombre mostrado en la franja, name: program, widget: string }
          - { label: Lugar mostrado en la franja, name: location, widget: string }
          - { label: Texto del botón general, name: reserve, widget: string }
          - label: Nombres de los siete días
            name: days
            widget: object
            fields:
              - { label: Lunes, name: monday, widget: string }
              - { label: Martes, name: tuesday, widget: string }
              - { label: Miércoles, name: wednesday, widget: string }
              - { label: Jueves, name: thursday, widget: string }
              - { label: Viernes, name: friday, widget: string }
              - { label: Sábado, name: saturday, widget: string }
              - { label: Domingo, name: sunday, widget: string }
      - name: schedule_ru
        label: Расписание RU
        file: src/data/schedule/ru.json
        fields:
          - { label: Номер и название раздела, name: number, widget: string }
          - label: Заголовок (две строки)
            name: title
            widget: object
            fields:
              - { label: Строка 1, name: first, widget: string }
              - { label: Строка 2, name: second, widget: string }
          - { label: Подпись информации для скринридеров, name: info, widget: string }
          - { label: Тип занятия в общей строке, name: kind, widget: string }
          - { label: Подпись списка для скринридеров, name: label, widget: string }
          - { label: Название в общей строке, name: program, widget: string }
          - { label: Место в общей строке, name: location, widget: string }
          - { label: Подпись общей кнопки, name: reserve, widget: string }
          - label: Названия семи дней недели
            name: days
            widget: object
            fields:
              - { label: Понедельник, name: monday, widget: string }
              - { label: Вторник, name: tuesday, widget: string }
              - { label: Среда, name: wednesday, widget: string }
              - { label: Четверг, name: thursday, widget: string }
              - { label: Пятница, name: friday, widget: string }
              - { label: Суббота, name: saturday, widget: string }
              - { label: Воскресенье, name: sunday, widget: string }

      - name: about_es
        label: Sobre mí ES
        file: src/data/about/es.json
        fields:
          - { label: Número y nombre de sección, name: number, widget: string }
          - { label: Frase introductoria, name: intro, widget: string }
          - { label: Texto alternativo de la fotografía, name: alt, widget: string }
          - label: Biografía (cuatro párrafos fijos)
            name: paragraphs
            widget: object
            fields:
              - { label: Párrafo 1, name: first, widget: string }
              - { label: Párrafo 2, name: second, widget: string }
              - { label: Párrafo 3, name: third, widget: string }
              - { label: Párrafo 4, name: fourth, widget: string }
          - label: Afirmación final (dos partes)
            name: statement
            widget: object
            fields:
              - { label: Primera parte, name: first, widget: string }
              - { label: Segunda parte destacada, name: second, widget: string }
      - name: about_ru
        label: Обо мне RU
        file: src/data/about/ru.json
        fields:
          - { label: Номер и название раздела, name: number, widget: string }
          - { label: Вводная фраза, name: intro, widget: string }
          - { label: Альтернативный текст фотографии, name: alt, widget: string }
          - label: Биография (четыре фиксированных абзаца)
            name: paragraphs
            widget: object
            fields:
              - { label: Абзац 1, name: first, widget: string }
              - { label: Абзац 2, name: second, widget: string }
              - { label: Абзац 3, name: third, widget: string }
              - { label: Абзац 4, name: fourth, widget: string }
          - label: Заключительное утверждение (две части)
            name: statement
            widget: object
            fields:
              - { label: Первая часть, name: first, widget: string }
              - { label: Вторая выделенная часть, name: second, widget: string }
      - name: about_photo
        label: Fotografía ES + RU / Общее фото
        file: src/data/about/photo.json
        fields:
          - label: Fotografía / Фотография
            name: image
            widget: image
            hint: "Una foto para ES y RU. Recomendado: retrato aprox. 2:3, como el PNG actual de 1025 × 1535 px, con fondo transparente y composición similar. Prepara encuadre, proporciones y tamaño antes de subir; no hay recorte ni procesamiento automático. Общее фото ES/RU: заранее подготовьте портрет около 2:3, прозрачный фон и композицию как у исходного PNG 1025 × 1535. Автоматического кадрирования и обработки нет."

      - name: contact_es
        label: Contacto ES
        file: src/data/contact/es.json
        fields:
          - { label: Número y nombre de sección, name: number, widget: string }
          - label: Título principal
            name: title
            widget: string
            hint: "Conserva el guion blando U+00AD entre ENTRE y NAMOS; no lo sustituyas por un guion normal."
          - label: Cierre base (dos partes)
            name: closing
            widget: object
            fields:
              - { label: Primera parte, name: first, widget: string }
              - { label: Segunda parte destacada, name: second, widget: string }
          - label: Cierre de escritorio (dos partes)
            name: desktopClosing
            widget: object
            hint: "El CSS actual muestra esta variante también en móvil ES. La variante base se conserva sin cambiar ese comportamiento."
            fields:
              - { label: Primera parte, name: first, widget: string }
              - { label: Segunda parte destacada, name: second, widget: string }
          - { label: Texto del botón, name: reserve, widget: string }
      - name: contact_ru
        label: Контакт RU
        file: src/data/contact/ru.json
        fields:
          - { label: Номер и название раздела, name: number, widget: string }
          - label: Главный заголовок
            name: title
            widget: string
          - label: Заключительный текст mobile (две части)
            name: closing
            widget: object
            fields:
              - { label: Первая часть, name: first, widget: string }
              - { label: Вторая выделенная часть, name: second, widget: string }
          - label: Заключительный текст desktop (две части)
            name: desktopClosing
            widget: object
            fields:
              - { label: Первая часть, name: first, widget: string }
              - { label: Вторая выделенная часть, name: second, widget: string }
          - { label: Подпись кнопки записи, name: reserve, widget: string }
      - name: contact_links
        label: WhatsApp CONTACTO ES + RU
        file: src/data/contact/links.json
        fields:
          - label: WhatsApp URL
            name: whatsappUrl
            widget: string
            pattern: ['^https://[^\s]+$', 'Usa una URL HTTPS completa, por ejemplo https://wa.me/50762331434.']
            hint: "Una sola URL para CONTACTO en ES y RU. No modifica los enlaces de HERO, CLASES ni HORARIOS."

  - name: blog_es
    label: Blog ES
    label_singular: Artículo ES
    folder: src/content/blog
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} — {{publishDate}}"
    sortable_fields: [title, publishDate]
    view_filters:
      - label: Borradores
        field: draft
        pattern: "true"
      - label: Publicados
        field: draft
        pattern: "false"
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Descripción, name: description, widget: text }
      - label: Fecha de publicación
        name: publishDate
        widget: datetime
        default: "{{now}}"
        date_format: YYYY-MM-DD
        time_format: HH:mm:ss
        format: YYYY-MM-DDTHH:mm:ss.SSSZ
        picker_utc: true
      - label: Fecha de actualización
        name: updatedDate
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        picker_utc: true
        required: false
      - { label: Autor, name: author, widget: string, default: "Iosif Ruiz" }
      - { label: Categoría, name: category, widget: string, required: false }
      - label: Etiquetas
        name: tags
        widget: list
        default: []
        required: false
        field: { label: Etiqueta, name: tag, widget: string }
      - label: Portada
        name: cover
        widget: object
        required: false
        collapsed: false
        hint: "Imagen recomendada: 1600 × 900 px (16:9). El CMS no recorta ni redimensiona la imagen."
        fields:
          - { label: Imagen, name: image, widget: image }
          - { label: Texto alternativo, name: alt, widget: string }
      - label: Imagen social
        name: socialImage
        widget: image
        required: false
        hint: "Opcional. Si se omite, el sitio usa la portada."
      - label: Borrador
        name: draft
        widget: boolean
        default: true
        hint: "Actívalo para excluir el artículo del sitio, RSS, sitemap y navegación. Desactívalo antes de publicar."
      - { label: Slug de traducción rusa, name: translationSlug, widget: string, required: false, hint: "Slug exacto del artículo equivalente en Blog RU." }
      - { label: Texto, name: body, widget: markdown }

  - name: blog_ru
    label: Blog RU
    label_singular: Статья RU
    folder: src/content/blog/ru
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} — {{publishDate}}"
    sortable_fields: [title, publishDate]
    view_filters:
      - label: Borradores
        field: draft
        pattern: "true"
      - label: Publicados
        field: draft
        pattern: "false"
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Descripción, name: description, widget: text }
      - label: Fecha de publicación
        name: publishDate
        widget: datetime
        default: "{{now}}"
        date_format: YYYY-MM-DD
        time_format: HH:mm:ss
        format: YYYY-MM-DDTHH:mm:ss.SSSZ
        picker_utc: true
      - label: Fecha de actualización
        name: updatedDate
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        picker_utc: true
        required: false
      - { label: Autor, name: author, widget: string, default: "Iosif Ruiz" }
      - { label: Categoría, name: category, widget: string, required: false }
      - label: Etiquetas
        name: tags
        widget: list
        default: []
        required: false
        field: { label: Etiqueta, name: tag, widget: string }
      - label: Portada
        name: cover
        widget: object
        required: false
        collapsed: false
        hint: "Imagen recomendada: 1600 × 900 px (16:9). El CMS no recorta ni redimensiona la imagen."
        fields:
          - { label: Imagen, name: image, widget: image }
          - { label: Texto alternativo, name: alt, widget: string }
      - label: Imagen social
        name: socialImage
        widget: image
        required: false
        hint: "Opcional. Si se omite, el sitio usa la portada."
      - label: Borrador
        name: draft
        widget: boolean
        default: true
        hint: "Actívalo para excluir el artículo del sitio, RSS, sitemap y navegación. Desactívalo antes de publicar."
      - { label: Slug испанского перевода, name: translationSlug, widget: string, required: false, hint: "Точный slug соответствующей статьи в Blog ES." }
      - { label: Текст, name: body, widget: markdown }
